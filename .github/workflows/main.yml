name: GlobalFin examen
 
on:
  push:
    branches: [ "main" ]
    paths:
      - 'frontend/**'
      - 'backend/**'
      - 'infrastructure/**'
      - '!docs/**'
  pull_request:
    branches: [ "main" ]
 
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
 
permissions:
  contents: read
 
jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      backend_changed: ${{ steps.filter.outputs.backend }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.1.1
        
      - name: Detect changes
        id: filter
        run: |
          echo "backend=true" >> $GITHUB_OUTPUT
 
  backend-matrix-ci:
    needs: detect-changes
    if: needs.detect-changes.outputs.backend_changed == 'true'
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [18, 20]
        exclude:
          - os: windows-latest
            node: 18
    uses: ./.github/workflows/reusable-backend.yml
    with:
      node-version: ${{ matrix.node }}
 
  deploy-staging:
    needs: backend-matrix-ci
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Deploy Staging
        run: echo "Desplegando en Staging..."
 
  deploy-production:
    needs: deploy-staging
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy
        run: echo "Desplegando en Producción de manera segura..."
      
      - name: Generar Reporte Markdown
        run: |
          echo "### Despliegue completado 🚀" >> $GITHUB_STEP_SUMMARY
          echo "Entorno: Producción" >> $GITHUB_STEP_SUMMARY
