Name: GlobalFin Enterprise CI/CD Examen

On:
  Push:
    Branches: [ “main” ]
    Paths:
      - ‘frontend/**’  # Selective execution
      - ‘backend/**’   # Selective execution
      - ‘infrastructure/**’ # Selective execution
      - ‘!docs/**’     # Ignora documentación
  Pull_request:
    Branches: [ “main” ]

# Optimización: Cancela ejecuciones antiguas si hay un nuevo push
Concurrency:
  Group: ${{ github.workflow }}-${{ github.ref }}
  Cancel-in-progress: true

# Seguridad: Permisos mínimos globales
Permissions:
  Contents: read

Jobs:
  Detect-changes:
    Runs-on: ubuntu-latest
    Outputs:
      Backend_changed: ${{ steps.filter.outputs.backend }}
    Steps:
      - uses: actions/checkout@v4.1.1
      - name: Detect changes
        Id: filter
        Run: |
          Echo “backend=true” >> $GITHUB_OUTPUT # Simulación de detección para el examen

  Backend-matrix-ci:
    Needs: detect-changes
    If: needs.detect-changes.outputs.backend_changed == ‘true’
    Strategy:
      Matrix:
        Os: [ubuntu-latest, windows-latest]
        Node: [18, 20]
        Exclude:
Os: windows-latest
Node: 18 # Include/exclude matrix
    Uses: ./.github/workflows/reusable-backend.yml
    With:
      Node-version: ${{ matrix.node }}

  Deploy-staging:
    Needs: backend-matrix-ci
    Runs-on: ubuntu-latest
    Environment: staging
    Permissions:
      Contents: read
      Deployments: write # Permiso específico por job
    Steps:
Run: echo “Desplegando en Staging…”

  Deploy-production:
    Needs: deploy-staging
    Runs-on: ubuntu-latest
    Environment: production # Exigirá aprobación manual en la UI
    Steps:
Name: Deploy
        Run: echo “Desplegando en Producción de manera segura…”
      
Name: Generar Reporte Markdown
        Run: |
          Echo “### Despliegue completado 🚀” >> $GITHUB_STEP_SUMMARY
          Echo “Entorno: Producción” >> $GITHUB_STEP_SUMMARY
